[pytest]
pythonpath = py
testpaths = tests
norecursedirs = venv .venv .* build dist
addopts = --import-mode=importlib
markers =
    flask: Flask-only tests
    django: Django-only tests
    fast: FastAPI-only tests
    packaging: Packaging/release tests
    mutation: Mutation/tooling tests
    perf: Performance tests
    slow: Slow-running tests
    soak: Soak tests
    rust: Requires and exercises the real aiwaf-rust extension
