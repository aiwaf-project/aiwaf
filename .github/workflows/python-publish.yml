name: Publish Python package to PyPI

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest pytest-cov coverage httpx pip-audit redis
          python -m pip install ".[django,flask,fastapi,rust]"

      - name: Verify Python release tests and coverage
        run: python aiwaf_test.py --python-only --coverage

      - name: Audit production dependencies
        run: |
          python scripts/python_release_requirements.py > production-requirements.txt
          python -m pip_audit --strict --no-deps --disable-pip -r production-requirements.txt

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distributions and installed wheel
        run: |
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest tests.core.test_sql_injection tests.django.test_sql_injection tests.flask.test_sql_injection tests.fast.test_sql_injection

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/aiwaf
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
