name: Publish JavaScript package to npm

on:
  push:
    tags:
      - "js-v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Use current npm CLI
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Stage shared package assets
        run: |
          cp ../README.md README.md
          mkdir -p geolock
          cp ../py/aiwaf/core/geolock/ipinfo_lite.mmdb geolock/ipinfo_lite.mmdb

      - name: Stage package for npm approval
        run: npm stage publish --access public
