name: Monorepo tests

on:
  push:
    branches: [main]
    paths:
      - "py/**"
      - "rust/**"
      - "js/**"
      - "tests/**"
      - "aiwaf_test.py"
      - "manage.py"
      - "conftest.py"
      - "pyproject.toml"
      - "setup.py"
      - "pytest.ini"
      - "package.json"
      - ".github/workflows/test.yml"
      - ".github/actions/setup-python-from-source/**"
      - "scripts/check_rust_source_build.py"
      - "scripts/stage_rust_package_files.py"
      - "scripts/build_wasm_from_source.py"
  pull_request:
    branches: [main]
    paths:
      - "py/**"
      - "rust/**"
      - "js/**"
      - "tests/**"
      - "aiwaf_test.py"
      - "manage.py"
      - "conftest.py"
      - "pyproject.toml"
      - "setup.py"
      - "pytest.ini"
      - "package.json"
      - ".github/workflows/test.yml"
      - ".github/actions/setup-python-from-source/**"
      - "scripts/check_rust_source_build.py"
      - "scripts/stage_rust_package_files.py"
      - "scripts/build_wasm_from_source.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install Python packages with aiwaf-rust from source
        uses: ./.github/actions/setup-python-from-source
        with:
          packages: -e ".[django,flask,fastapi]" pytest pytest-cov coverage httpx redis djangorestframework python-multipart

      - name: Install JavaScript dependencies
        run: npm ci --prefix js

      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          command -v wasm-pack || cargo install wasm-pack --locked

      - name: Build aiwaf-wasm from source for Node.js
        run: python scripts/build_wasm_from_source.py

      - name: Report SQL detector accuracy
        run: python scripts/sql_accuracy.py

      - name: Run monorepo test suite
        run: python aiwaf_test.py --coverage --no-rust-build
