name: Monorepo tests

on:
  push:
    branches: [main]
    paths:
      - "py/**"
      - "js/**"
      - "tests/**"
      - "aiwaf_test.py"
      - "manage.py"
      - "conftest.py"
      - "pyproject.toml"
      - "setup.py"
      - "pytest.ini"
      - "package.json"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "py/**"
      - "js/**"
      - "tests/**"
      - "aiwaf_test.py"
      - "manage.py"
      - "conftest.py"
      - "pyproject.toml"
      - "setup.py"
      - "pytest.ini"
      - "package.json"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[django,flask,fastapi,rust]"
          python -m pip install pytest pytest-cov coverage httpx

      - name: Install JavaScript dependencies
        run: npm ci --prefix js

      - name: Run monorepo test suite
        run: python aiwaf_test.py --coverage
