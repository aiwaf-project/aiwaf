name: Java tests and security

on:
  push:
    branches: [main]
    paths:
      - "java/**"
      - "py/aiwaf/core/geolock/ipinfo_lite.mmdb"
      - "LICENSE"
      - ".github/workflows/java-security.yml"
      - ".github/workflows/java-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "java/**"
      - "py/aiwaf/core/geolock/ipinfo_lite.mmdb"
      - "LICENSE"
      - ".github/workflows/java-security.yml"
      - ".github/workflows/java-publish.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Test
        run: mvn -B -f java/pom.xml test

      - name: Set Dependency-Check cache key
        id: dependency-check-date
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check database
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ steps.dependency-check-date.outputs.date }}
          restore-keys: |
            dependency-check-${{ runner.os }}-12.2.2-

      - name: Dependency vulnerability gate
        run: >
          mvn -B -f java/pom.xml org.owasp:dependency-check-maven:12.2.2:check
          -DfailBuildOnCVSS=7
          -DfailOnError=true
          -DdataDirectory="${{ runner.temp }}/dependency-check-data"
          -DnvdValidForHours=24
          -DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: java-dependency-check-report
          path: java/target/dependency-check-report.html
          if-no-files-found: warn
      - name: Generate CycloneDX SBOM
        working-directory: java
        run: >
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom
          -Dcyclonedx.skipNotDeployed=false
          -DoutputDirectory="${{ github.workspace }}/java/target"
          -DoutputFormat=all
          -DoutputName=bom
      - name: Verify CycloneDX SBOM
        shell: bash
        run: |
          test -s java/target/bom.json
          test -s java/target/bom.xml
      - uses: actions/upload-artifact@v6
        with:
          name: java-cyclonedx-sbom
          path: |
            java/target/bom.json
            java/target/bom.xml
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source=/github/workspace --redact --verbose

  codeql:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/pom.xml
      - run: mvn -B -f java/pom.xml -DskipTests package
      - uses: github/codeql-action/analyze@v4
