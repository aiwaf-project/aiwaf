name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "py/**"
      - "tests/**"
      - "manage.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.py"
      - "pytest.ini"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "py/**"
      - "tests/**"
      - "manage.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.py"
      - "pytest.ini"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[django,flask,fastapi]"
          python -m pip install pytest httpx

      - name: Test Django adapter
        run: python manage.py test tests.django

      - name: Test core and other adapters
        run: python -m pytest tests/core tests/flask tests/fast tests/integration -q
