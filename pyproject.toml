[project]
name = "aiwaf"
version = "0.1.9.7.5"
description = "AI-driven, self-learning Web Application Firewall for Python web applications"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{ name = "Aayush Gauba", email = "gauba.aayush@gmail.com" }]
classifiers = [
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0,<2.0",
    "joblib>=1.4.3",
    "geoip2>=4.0",
    "packaging>=21.0",
    "requests>=2.25.0",
    "python-whois>=0.9.0"
]

[project.optional-dependencies]
django = [
    "Django>=3.2"
]
flask = [
    "Flask>=2.3",
    "Flask-SQLAlchemy>=3.0"
]
fastapi = [
    "fastapi>=0.110",
    "starlette>=0.36",
    "uvicorn>=0.27"
]
rust = [
    "aiwaf-rust>=0.1.6"
]

[project.scripts]
aiwaf = "aiwaf.cli:main"
aiwaf-detect = "aiwaf.cli:aiwaf_detect"
aiwaf-fast = "aiwaf.fast.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiwaf*"]

[tool.setuptools.package-data]
"aiwaf.django" = ["resources/*.pkl", "resources/*.json"]
"aiwaf.flask" = ["resources/*.pkl", "resources/*.json"]
"aiwaf.core" = ["geolock/*.mmdb"]
