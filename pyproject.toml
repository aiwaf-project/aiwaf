[project]
name = "aiwaf"
version = "0.1.9.7.6"
description = "AI-driven, self-learning Web Application Firewall for Python web applications"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{ name = "Aayush Gauba", email = "gauba.aayush@gmail.com" }]
classifiers = [
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0,<2.0",
    "joblib>=1.5.3",
    "geoip2>=5.2.0",
    "packaging>=26.2",
    "requests>=2.34.2",
    "python-whois>=0.9.6"
]

[project.optional-dependencies]
django = [
    "Django>=6.0.6"
]
flask = [
    "Flask>=3.1.3",
    "Flask-SQLAlchemy>=3.1.1"
]
fastapi = [
    "fastapi>=0.138.0",
    "starlette>=1.3.1",
    "uvicorn>=0.49.0"
]
rust = [
    "aiwaf-rust>=0.1.6"
]

[project.scripts]
aiwaf = "aiwaf.cli:main"
aiwaf-detect = "aiwaf.cli:aiwaf_detect"
aiwaf-fast = "aiwaf.fast.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiwaf*"]

[tool.setuptools.package-data]
"aiwaf.django" = ["resources/*.pkl", "resources/*.json"]
"aiwaf.flask" = ["resources/*.pkl", "resources/*.json"]
"aiwaf.core" = ["geolock/*.mmdb"]
